name: Build & Deploy (legacy droplet)

# Manual only: the app now runs on a home server behind a Cloudflare Tunnel (see DEPLOY.md),
# which GitHub-hosted runners can't SSH into. Pushing to main no longer triggers a deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy TeachersRating
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.SSH_HOST }}            # IP address of your server
          key: ${{ secrets.SSH_KEY }}              # Private SSH key for SSH login to droplet
          username: ${{ secrets.SSH_USERNAME }}    # SSH username
          script: |
            echo "========== START DEPLOYMENT =========="
            echo "Initial working directory:"
            pwd
            echo "Initial directory contents:"
            ls -la

            echo "---------- Moving to home ----------"
            cd ~
            echo "Now in directory:"
            pwd
            echo "Contents of home directory:"
            ls -la

            echo "---------- Cleaning old deployment ----------"
            if [ -d "LecturerSmash" ]; then
              echo "LecturerSmash exists. Stopping containers and removing it..."
              cd LecturerSmash
              docker compose down || true
              cd ..
              rm -rf LecturerSmash
            else
              echo "No previous LecturerSmash folder found."
            fi

            echo "---------- Verifying SSH access to GitHub ----------"
            ssh -T git@github.com || true

            echo "---------- Cloning repository ----------"
            git clone git@github.com:DenysLeontiev/LecturerSmash.git

            echo "---------- Confirming clone location ----------"
            echo "Current directory:"
            pwd
            echo "Checking if LecturerSmash exists:"
            ls -la | grep LecturerSmash || echo "LecturerSmash not found!"
            echo "Full absolute path of LecturerSmash:"
            realpath LecturerSmash || echo "realpath command not available"

            echo "---------- Preparing persistent sqlite directory ----------"
            if [ ! -d "/root/sqlite" ]; then
              echo "sqlite folder not found, creating it..."
              mkdir -p /root/sqlite
              chmod 777 /root/sqlite
            else
              echo "sqlite folder already exists, keeping existing data."
            fi
            ls -ld /root/sqlite

            echo "---------- Building and running containers ----------"
            cd /root/LecturerSmash
            echo "Now in directory:"
            pwd
            
            docker system prune -a --volumes=false -f
            docker builder prune --all -f
            
            docker compose build --no-cache
            docker compose up -d

            echo "---------- Deployment complete ----------"
            echo "Currently in:"
            pwd
            echo "Running containers:"
            docker ps
            echo "========== DEPLOYMENT FINISHED =========="
