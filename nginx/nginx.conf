# Reverse proxy in front of the app (https://app.unicrush.online).
# The Cloudflare tunnel (separate cloudflared on the VPS) points at the host port published in compose.yaml (8081).
# server_name is a catch-all so the site also works via http://<VPS-IP>:8081 for testing.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind Cloudflare the real visitor IP is in CF-Connecting-IP; fall back to the TCP peer.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# Cloudflare terminates TLS and sends X-Forwarded-Proto: https; keep it if present.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # Resolve container names through Docker's DNS on every request (cached 10s), so a rebuilt
    # api/client container with a new IP doesn't leave nginx proxying to a dead address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream    http://api:5166;
    set $client_upstream http://client:80;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # REST API
    location /api/ {
        proxy_pass $api_upstream;
    }

    # SignalR (WebSockets + long polling fallback)
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Swagger UI
    location /swagger {
        proxy_pass $api_upstream;
    }

    # Angular app (the client container handles SPA fallback to index.html)
    location / {
        proxy_pass $client_upstream;
    }
}
