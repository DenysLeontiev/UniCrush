<div class="page-header">
  <h2 class="page-title">Свайпай викладачів</h2>
  <p class="page-subtitle">Та залишай коментарі</p>

  <div class="info-wrapper">
    <button class="share-button" (click)="openShareModal()">
      <span class="share-icon">📤</span>
      <span>Поділитися</span>
    </button>

    <a href="https://t.me/nulp_support" target="_blank" class="support-link">
      <svg class="telegram-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.52-.47-.02-1.38-.27-2.05-.49-.82-.27-1.48-.42-1.42-.88.03-.24.37-.49 1.02-.74 3.99-1.74 6.66-2.89 8-3.45 3.8-1.61 4.6-1.89 5.12-1.9.11 0 .37.03.53.16.14.11.17.26.19.37.01.08.03.29.01.45z"
          fill="currentColor" />
      </svg>
      <span>Підтримка</span>
    </a>
  </div>
</div>

<div class="selection-container">
  <div class="selection-form">
    <a routerLink="/top-workers" class="top-workers-link">
      <button type="button" class="top-workers-btn">
        <b>Топ Викладачів</b>
      </button>
    </a>

    <h3>Оберіть Інститут та Кафедру</h3>

    @if (error()) {
    <div class="error-message">
      {{ error() }}
    </div>
    }

    <div class="form-group">
      <label for="institute">Інститут:</label>
      <select id="institute" [value]="selectedInstituteId()" (change)="onInstituteChange($event)"
        [disabled]="isLoading()" class="form-select">
        <option value="">Оберіть Інститут...</option>
        @for (institute of institutes(); track institute.id) {
        <option [value]="institute.id">{{ institute.name | instituteRename }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="department">Кафедра:</label>
      <select id="department" [value]="selectedDepartmentId()" (change)="onDepartmentChange($event)"
        [disabled]="isLoading() || !selectedInstituteId()" class="form-select">
        <option value="">Оберіть Кафедру...</option>
        @for (department of departments(); track department.id) {
        <option [value]="department.id">{{ department.longName }}</option>
        }
      </select>
    </div>

    <button class="start-btn" (click)="startComparison()" [disabled]="!canStartComparison()">
      @if (isLoading()) {
      <span class="spinner"></span>
      Завантаження...
      } @else {
      Почати порівнювати
      }
    </button>
  </div>
</div>
