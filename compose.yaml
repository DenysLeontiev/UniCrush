# Production stack for the home server (https://app.unicrush.online).
#
#   Internet -> Cloudflare -> cloudflared (runs separately on the VPS) -> host:8081 -> nginx -> client (Angular static files)
#                                                                                         \-> api (/api, /hubs, /swagger) -> postgres
#
# All settings live in config files, no .env:
#   - API:      TeachersRating.API/appsettings.json   (connection string, ClientUrl)
#   - Angular:  TeachersRating.Client/src/environments/environment.ts
#   - Nginx:    nginx/nginx.conf, host port below
#   - Postgres: below
#   - Teacher list refresh: ./update-teachers.sh (runs the `scraper` service, then restarts the API)
# The Postgres password here must match the one in appsettings.json (and appsettings.Development.json).
# See DEPLOY.md for the full setup.

name: lecturersmash

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teachersrating
      POSTGRES_USER: teachersrating
      POSTGRES_PASSWORD: 61ehanon
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only reachable from the server itself (psql / backups / DB GUI over SSH).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachersrating -d teachersrating"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: teachersratingapi
    build:
      context: .
      dockerfile: TeachersRating.API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      # Fresh teacher lists from the scraper (see `scraper` below). The newest of this and the
      # list bundled in the image is synced into the DB on every API start.
      - scraper-data:/app/scraper-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5166"

  client:
    image: teachersratingclient
    build:
      context: ./TeachersRating.Client
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # "<host port>:80" — the Cloudflare tunnel's public hostname app.unicrush.online points at this port
      # (http://<VPS-IP>:8081, or http://localhost:8081 if cloudflared uses host networking).
      - "8081:80"
    depends_on:
      - api
      - client

  # One-off job, not started by `docker compose up`. Refresh the teacher list with:
  #   ./update-teachers.sh
  # (= docker compose run --rm --build scraper && docker compose restart api)
  scraper:
    image: unicrushscraper
    build:
      context: ./NulpScrapper
    volumes:
      - scraper-data:/data
    profiles: ["tools"]

volumes:
  pgdata:
  scraper-data:
